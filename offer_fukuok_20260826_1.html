<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mango Tour - Ваше предложение</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --line: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;
            --orange: #f97316;
            --orange-soft: #fff7ed;
            --green: #16a34a;
            --green-soft: #f0fdf4;
            --blue-soft: #eff6ff;
            --shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 14px;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        a { color: inherit; text-decoration: none; }
        img { display: block; max-width: 100%; }
        button { font: inherit; }

        .page {
            max-width: 420px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 64px;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid #f1f5f9;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
            backdrop-filter: blur(10px);
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
            flex-shrink: 0;
        }

        .brand-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.28em;
            color: #facc15;
            white-space: nowrap;
        }

        .socials {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        .social-btn {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
            font-size: 20px;
            font-weight: 700;
        }

        .social-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        .social-facebook {
            background: #1877f2;
        }

        .main {
            padding: 22px 14px 0;
            display: grid;
            gap: 18px;
        }

        .card {
            background: var(--card);
            border: 1px solid #f1f5f9;
            border-radius: 28px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .hero-bar {
            background: var(--orange);
            padding: 24px 24px 20px;
            color: #fff;
        }

        .hero-title {
            margin: 0;
            font-size: 34px;
            line-height: 1;
            font-weight: 900;
            letter-spacing: -0.03em;
        }

        .trip-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-bottom: 1px solid var(--line);
        }

        .trip-cell {
            padding: 16px 20px;
            font-size: 17px;
            font-weight: 800;
            border-right: 1px solid var(--line);
        }

        .trip-cell:last-child { border-right: 0; }

        .flight-list { display: grid; }

        .flight-row {
            display: grid;
            grid-template-columns: 44px 1fr auto;
            gap: 14px;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--line);
        }

        .flight-row:last-child { border-bottom: 0; }

        .flight-icon {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .flight-icon.outbound { background: var(--orange-soft); color: var(--orange); }
        .flight-icon.return { background: var(--blue-soft); color: #2563eb; }

        .flight-time {
            margin: 0;
            font-size: 20px;
            font-weight: 900;
        }

        .flight-meta, .flight-duration {
            margin: 3px 0 0;
            color: var(--muted);
        }

        .flight-meta { font-size: 13px; }
        .flight-duration { font-size: 12px; }

        .badge {
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 900;
            white-space: nowrap;
        }

        .badge.green { background: #dcfce7; color: #166534; }
        .badge.gray { background: #f3f4f6; color: #6b7280; }

        .hotel-card { overflow: hidden; }

        .carousel {
            position: relative;
            width: 100%;
            height: 256px;
            background: #f3f4f6;
        }

        .carousel-track {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .carousel-track::-webkit-scrollbar { display: none; }

        .carousel-slide {
            position: relative;
            width: 100%;
            height: 100%;
            flex: 0 0 100%;
            scroll-snap-align: center;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-empty {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            font-size: 14px;
            font-weight: 600;
        }

        .carousel-overlay {
            position: absolute;
            inset: auto 0 0 0;
            padding: 44px 16px 16px;
            background: linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0.28), rgba(0,0,0,0));
        }

        .carousel-link-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.92);
            color: #111827;
            border-radius: 18px;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .carousel-count {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.42);
            color: #fff;
            border-radius: 12px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 800;
        }

        .carousel-dots {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 12px;
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .carousel-dot {
            border: 0;
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: rgba(255,255,255,0.52);
            padding: 0;
        }

        .carousel-dot.active {
            width: 18px;
            background: #fff;
        }

        .section-body {
            padding: 20px;
            display: grid;
            gap: 16px;
        }

        .hotel-name {
            margin: 0;
            font-size: 24px;
            font-weight: 900;
            line-height: 1.1;
        }

        .hotel-meta {
            margin-top: 10px;
            padding-left: 14px;
            border-left: 4px solid #fb923c;
        }

        .hotel-meta-top {
            font-size: 12px;
            font-weight: 800;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .rating-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rating-chip {
            background: #fef3c7;
            color: #b45309;
            border-radius: 8px;
            padding: 3px 8px;
            font-size: 14px;
            font-weight: 900;
        }

        .muted-text {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.65;
        }

        .expandable-text {
            position: relative;
        }

        .expandable-text-content {
            color: #374151;
            line-height: 1.7;
            font-size: 14px;
            overflow: hidden;
        }

        .expandable-text-content.clamped {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .expandable-toggle {
            margin-top: 10px;
            border: 0;
            background: transparent;
            color: var(--orange);
            padding: 0;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
        }

        .soft-block {
            background: #f9fafb;
            border-radius: 18px;
            padding: 16px;
        }

        .soft-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .soft-icon {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
            background: var(--orange-soft);
            color: var(--orange);
        }

        .soft-title {
            margin: 0;
            font-size: 17px;
            font-weight: 900;
        }

        .soft-caption {
            margin: 4px 0 0;
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            font-weight: 800;
        }

        .soft-value {
            margin: 4px 0 0;
            font-size: 14px;
            color: #374151;
            font-weight: 700;
        }

        .included {
            background: var(--green-soft);
            border: 1px solid #dcfce7;
            border-radius: 18px;
            padding: 16px;
        }

        .included .soft-icon {
            background: #fff;
            color: var(--green);
        }

        .included-label {
            margin: 0 0 6px;
            color: #15803d;
            text-transform: uppercase;
            font-size: 12px;
            font-weight: 900;
        }

        .included-text {
            margin: 0;
            color: #374151;
            font-size: 14px;
            line-height: 1.65;
            font-weight: 700;
        }

        .outline-btn {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            border: 1px solid #fed7aa;
            border-radius: 18px;
            color: var(--orange);
            font-size: 13px;
            font-weight: 900;
            text-transform: uppercase;
            font-style: italic;
        }

        .order-btn {
            display: block;
            background: var(--orange);
            color: #fff;
            border-radius: 24px;
            padding: 22px 20px;
            text-align: center;
            box-shadow: 0 18px 34px rgba(249, 115, 22, 0.24);
        }

        .order-price {
            margin: 0 0 16px;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: -0.04em;
        }

        .order-chip {
            display: inline-flex;
            width: 100%;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #25d366;
            border-radius: 18px;
            padding: 14px;
            font-size: 15px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .reels-card {
            padding: 20px;
        }

        .section-title {
            margin: 0 0 16px;
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .reels-row {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding-bottom: 4px;
        }

        .reels-row::-webkit-scrollbar { display: none; }

        .reel-card {
            position: relative;
            width: 128px;
            height: 224px;
            flex: 0 0 auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.12);
        }

        .reel-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .reel-play {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.2);
            color: #fff;
            font-size: 38px;
        }

        .notice-card { padding: 20px; }

        .notice-row {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .notice-title {
            margin: 0 0 8px;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .notice-text {
            margin: 0;
            color: #374151;
            font-size: 14px;
            line-height: 1.7;
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: rgba(15, 23, 42, 0.45);
            display: none;
        }

        .overlay.open { display: block; }

        .overlay-panel {
            position: absolute;
            inset: 0;
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        .overlay-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-bottom: 1px solid var(--line);
        }

        .overlay-title {
            margin: 0;
            font-size: 24px;
            font-style: italic;
            font-weight: 900;
        }

        .overlay-close {
            width: 46px;
            height: 46px;
            border: 0;
            background: #f3f4f6;
            border-radius: 18px;
            font-size: 22px;
            cursor: pointer;
        }

        .overlay-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9fafb;
            display: grid;
            gap: 16px;
        }

        .review-card {
            background: #fff;
            border: 1px solid #f1f5f9;
            border-radius: 24px;
            padding: 18px;
            box-shadow: var(--shadow);
        }

        .review-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .review-author {
            margin: 0;
            font-size: 16px;
            font-weight: 900;
        }

        .review-date {
            margin-top: 4px;
            color: #9ca3af;
            font-size: 12px;
            font-weight: 700;
        }

        .review-score {
            background: #fef3c7;
            color: #b45309;
            border-radius: 16px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 900;
            white-space: nowrap;
        }

        .review-trigger {
            border: 0;
            background: transparent;
            padding: 0;
            text-align: left;
            cursor: pointer;
            width: 100%;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="page" id="app"></div>

    <div class="overlay" id="reviews-overlay">
        <div class="overlay-panel">
            <div class="overlay-header">
                <h3 class="overlay-title">Отзывы гостей</h3>
                <button class="overlay-close" id="reviews-close" type="button">×</button>
            </div>
            <div class="overlay-body" id="reviews-list"></div>
        </div>
    </div>

            flights: parseInjectedJson(String.raw`[{"date": "2026.08.26", "depTime": "17:20", "arrTime": "21:25", "duration": "6 ч 5 мин", "baggage": "15 кг", "airline": "", "from": "", "to": "", "number": "", "type": "туда"}, {"date": "2026.09.02", "depTime": "17:45", "arrTime": "01:10", "duration": "5 ч 25 мин", "baggage": "только ручная кладь", "airline": "", "from": "", "to": "", "number": "", "type": "обратно"}]`, fallbackFlights),
            hotels: parseInjectedJson(String.raw`[{"name": "Herring Beach Hotel Phu Quoc", "stars": 3, "rating": null, "location": "Фукуок", "roomType": "Улучшенный двухместный номер с балконом", "mealPlan": "Без завтрака", "description": "Отель Herring Beach Hotel Phu Quoc расположен на живописном острове Фукуок, предлагая комфортный отдых недалеко от пляжа. К услугам гостей уютные номера с современными удобствами, бесплатный Wi-Fi и внимательный персонал для спокойного отпуска.", "amenities": [], "hotelLink": "https://www.google.com/maps/search/?api=1&query=Herring+Beach+Hotel+Phu+Quoc", "images": ["https://maps.google.com/maps/api/staticmap?center=40.82609495%2C-73.5683375&zoom=6&size=900x900&language=en&sensor=false&key=AIzaSyBoYjeRtfVI0Jd8Q_9mnflo9i4sOYpShB0&signature=YwneK4DSryYrd44gLByn1IGxocs"], "reviews": [], "price": "1,350,000 KRW"}, {"name": "Vinholidays Fiesta Phu Quoc", "stars": 3, "rating": null, "location": "Фукуок", "roomType": "Smart Stay - Breakfast", "mealPlan": "Завтрак включен", "description": "Современный отель на острове Фукуок предлагает стильные номера и развитую инфраструктуру. Гости могут воспользоваться открытым бассейном, фитнес-центром и удобным доступом к развлекательным зонам побережья.", "amenities": [], "hotelLink": "https://www.google.com/maps/search/?api=1&query=Vinholidays+Fiesta+Phu+Quoc", "images": ["https://maps.google.com/maps/api/staticmap?center=40.82609495%2C-73.5683375&zoom=6&size=900x900&language=en&sensor=false&key=AIzaSyBoYjeRtfVI0Jd8Q_9mnflo9i4sOYpShB0&signature=YwneK4DSryYrd44gLByn1IGxocs"], "reviews": [], "price": "1,700,000 KRW"}, {"name": "The Shells Resort & Spa - Phu Quoc", "stars": 5, "rating": null, "location": "Фукуок", "roomType": "Минимальная цена с завтраком", "mealPlan": "Завтрак включен", "description": "Роскошный курортный комплекс на берегу моря с уникальной архитектурой. Предлагает просторные номера с панорамным видом, спа-центр мирового класса, открытый бассейн и изысканные рестораны для расслабляющего отдыха.", "amenities": [], "hotelLink": "https://www.google.com/maps/search/?api=1&query=The+Shells+Resort+and+Spa+Phu+Quoc", "images": ["https://maps.google.com/maps/api/staticmap?center=40.82609495%2C-73.5683375&zoom=6&size=900x900&language=en&sensor=false&key=AIzaSyBoYjeRtfVI0Jd8Q_9mnflo9i4sOYpShB0&signature=YwneK4DSryYrd44gLByn1IGxocs"], "reviews": [], "price": "1,800,000 KRW"}, {"name": "Best Western Premier Sonasea Phu Quoc", "stars": 5, "rating": null, "location": "Фукуок", "roomType": "Делюкс с кроватью размера king, вид на сад", "mealPlan": "Завтрак включен", "description": "Элегантный курортный отель известной мировой сети предлагает премиальные условия размещения. Гостей ждут просторные интерьеры, живописная территория, большой лагунный бассейн и высокий уровень сервиса.", "amenities": [], "hotelLink": "https://www.google.com/maps/search/?api=1&query=Best+Western+Premier+Sonasea+Phu+Quoc", "images": ["https://maps.google.com/maps/api/staticmap?center=40.82609495%2C-73.5683375&zoom=6&size=900x900&language=en&sensor=false&key=AIzaSyBoYjeRtfVI0Jd8Q_9mnflo9i4sOYpShB0&signature=YwneK4DSryYrd44gLByn1IGxocs"], "reviews": [], "price": "2,050,000 KRW"}, {"name": "Seashells Phu Quoc Hotel & Spa", "stars": 5, "rating": null, "location": "Фукуок", "roomType": "Классический номер King Galaxy с видом на город", "mealPlan": "Завтрак включен", "description": "Пятизвездочный отель в центральной части Фукуока с прямым выходом к пляжу. Предлагает элегантные номера, панорамные виды на море, разнообразные рестораны, спа-комплекс и отличные условия для комфортного отдыха.", "amenities": [], "hotelLink": "https://www.google.com/maps/search/?api=1&query=Seashells+Phu+Quoc+Hotel+Spa", "images": ["https://maps.google.com/maps/api/staticmap?center=40.82609495%2C-73.5683375&zoom=6&size=900x900&language=en&sensor=false&key=AIzaSyBoYjeRtfVI0Jd8Q_9mnflo9i4sOYpShB0&signature=YwneK4DSryYrd44gLByn1IGxocs"], "reviews": [], "price": "2,100,000 KRW"}]`, fallbackHotels),
            igReels: parseInjectedJson(String.raw`[{"thumbnail": "https://raw.githubusercontent.com/mangotour/Offers/main/reel_1.png", "link": "https://www.instagram.com/stories/highlights/18404039212150167/"}, {"thumbnail": "https://raw.githubusercontent.com/mangotour/Offers/main/reel_2.png", "link": "https://www.instagram.com/stories/highlights/18073118810103351/"}, {"thumbnail": "https://raw.githubusercontent.com/mangotour/Offers/main/reel_3.png", "link": "https://www.instagram.com/stories/highlights/18207003232316313/"}, {"thumbnail": "https://raw.githubusercontent.com/mangotour/Offers/main/reel_4.png", "link": "https://www.instagram.com/stories/highlights/18098414977586720/"}]`, fallbackReels)
        };

        const app = document.getElementById("app");
        const overlay = document.getElementById("reviews-overlay");
        const reviewsList = document.getElementById("reviews-list");
        const reviewsClose = document.getElementById("reviews-close");

        const escapeHtml = (value) => String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");

        const getOrderLink = (hotel) => {
            const flightLines = (tourData.flights || []).map((flight) => {
                const label = flight.type ? flight.type.toUpperCase() : "РЕЙС";
                const date = flight.date ? `${flight.date} ` : "";
                const time = [flight.depTime, flight.arrTime].filter(Boolean).join(" - ");
                return `${label}: ${date}${time}`.trim();
            }).filter(Boolean);
            const details = [
                `Здравствуйте! Хочу заказать тур в отель ${hotel.name} по цене ${hotel.price || tourData.totalPrice}.`,
                tourData.dates ? `Даты тура: ${tourData.dates}.` : "",
                ...flightLines
            ].filter(Boolean).join("\n");
            return `https://wa.me/${tourData.contact.whatsapp}?text=${encodeURIComponent(details)}`;
        };

        const renderStarsText = (count) => {
            if (!count) return "";
            const lastDigit = Number(count) % 10;
            if (lastDigit === 1) return `${count} звезда`;
            if (lastDigit >= 2 && lastDigit <= 4) return `${count} звезды`;
            return `${count} звезд`;
        };

        const createCarousel = (hotel, hotelIndex) => {
            const images = Array.isArray(hotel.images) ? hotel.images.filter(Boolean) : [];
            if (!images.length) {
                return `<div class="carousel"><div class="carousel-empty">Нет доступных фото</div></div>`;
            }

            const slides = images.map((img, idx) => {
                const imageTag = `<img src="${escapeHtml(img)}" alt="${escapeHtml(hotel.name)} фото ${idx + 1}">`;
                const overlayHtml = hotel.hotelLink ? `
                    <div class="carousel-overlay">
                        <span class="carousel-link-chip">🖼 Больше фотографий</span>
                    </div>
                ` : "";
                const body = hotel.hotelLink
                    ? `<a class="carousel-slide" href="${escapeHtml(hotel.hotelLink)}" target="_blank" rel="noopener noreferrer">${imageTag}${overlayHtml}</a>`
                    : `<div class="carousel-slide">${imageTag}</div>`;
                return body;
            }).join("");

            const dots = images.length > 1 ? `
                <div class="carousel-dots">
                    ${images.map((_, idx) => `<button type="button" class="carousel-dot${idx === 0 ? " active" : ""}" data-carousel-dot="${hotelIndex}" data-index="${idx}"></button>`).join("")}
                </div>
            ` : "";

            const count = images.length > 1 ? `<div class="carousel-count" data-carousel-count="${hotelIndex}">1 / ${images.length}</div>` : "";

            return `
                <div class="carousel" data-carousel="${hotelIndex}">
                    <div class="carousel-track" data-carousel-track="${hotelIndex}">
                        ${slides}
                    </div>
                    ${count}
                    ${dots}
                </div>
            `;
        };

        const createExpandableText = (text, lines, className = "") => {
            if (!text) return "";
            return `
                <div class="expandable-text ${className}" data-lines="${lines}">
                    <div class="expandable-text-content clamped">${escapeHtml(text)}</div>
                    <button type="button" class="expandable-toggle hidden">Читать далее</button>
                </div>
            `;
        };

        const createFlightRows = () => {
            if (!tourData.flights || !tourData.flights.length) {
                return `<div class="flight-row"><div></div><div class="muted-text">Данные о рейсах уточняются</div><div></div></div>`;
            }

            return tourData.flights.map((flight) => {
                const isOutbound = (flight.type || "").toLowerCase().includes("туда");
                const iconClass = isOutbound ? "outbound" : "return";
                const icon = isOutbound ? "✈" : "🛬";
                const meta = [flight.airline, flight.number].filter(Boolean).join(" · ");
                const route = [flight.from, flight.to].filter(Boolean).join(" – ");
                const details = [meta, route].filter(Boolean).join(" · ");
                return `
                    <div class="flight-row">
                        <div class="flight-icon ${iconClass}">${icon}</div>
                        <div>
                            <p class="flight-time">${escapeHtml(flight.depTime || "--:--")} — ${escapeHtml(flight.arrTime || "--:--")}</p>
                            ${details ? `<p class="flight-meta">${escapeHtml(details)}</p>` : ""}
                            ${flight.duration ? `<p class="flight-duration">${escapeHtml(flight.duration)}</p>` : ""}
                        </div>
                        <div class="badge ${flight.baggage ? "green" : "gray"}">${flight.baggage ? `Багаж ${escapeHtml(flight.baggage)}` : "Без багажа"}</div>
                    </div>
                `;
            }).join("");
        };

        const createReviewsMarkup = (hotel, hotelIndex) => {
            const reviews = Array.isArray(hotel.reviews) ? hotel.reviews : [];
            if (!reviews.length) return "";
            return `
                <button type="button" class="outline-btn review-trigger" data-reviews-trigger="${hotelIndex}">
                    ⭐ Читать отзывы гостей
                </button>
            `;
        };

        const createHotelCard = (hotel, hotelIndex) => {
            const locationBits = [hotel.location, renderStarsText(hotel.stars)].filter(Boolean).join(" · ");
            const ratingMarkup = hotel.rating
                ? `
                    <div class="rating-row">
                        <span class="rating-chip">${Number(hotel.rating).toFixed(1).replace(".0", "")}</span>
                    </div>
                `
                : "";

            return `
                <section class="card hotel-card">
                    ${createCarousel(hotel, hotelIndex)}
                    <div class="section-body">
                        <div>
                            <h3 class="hotel-name">${escapeHtml(hotel.name)}</h3>
                            <div class="hotel-meta">
                                <div class="hotel-meta-top">${escapeHtml(locationBits)}</div>
                                ${ratingMarkup}
                            </div>
                        </div>

                        ${hotel.description ? createExpandableText(hotel.description, 5) : ""}

                        <div class="soft-block">
                            <div class="soft-row">
                                <div class="soft-icon">🛏</div>
                                <div>
                                    <p class="soft-title">${escapeHtml(hotel.roomType || "Тип номера уточняется")}</p>
                                    <p class="soft-caption">Питание</p>
                                    <p class="soft-value">${escapeHtml(hotel.mealPlan || "Уточняется")}</p>
                                </div>
                            </div>
                        </div>

                        ${tourData.included ? `
                            <div class="included">
                                <div class="soft-row">
                                    <div class="soft-icon">✓</div>
                                    <div>
                                        <p class="included-label">Включено в стоимость</p>
                                        <p class="included-text">${escapeHtml(tourData.included)}</p>
                                    </div>
                                </div>
                            </div>
                        ` : ""}

                        ${hotel.hotelLink ? `
                            <a class="outline-btn" href="${escapeHtml(hotel.hotelLink)}" target="_blank" rel="noopener noreferrer">↗ Узнать больше</a>
                        ` : ""}

                        ${createReviewsMarkup(hotel, hotelIndex)}

                        <a class="order-btn" href="${escapeHtml(getOrderLink(hotel))}" target="_blank" rel="noopener noreferrer">
                            <p class="order-price">${escapeHtml(hotel.price || tourData.totalPrice)}</p>
                            <span class="order-chip">💬 Заказать в WhatsApp</span>
                        </a>
                    </div>
                </section>
            `;
        };

        const createReelsSection = () => {
            if (!tourData.igReels || !tourData.igReels.length) return "";
            return `
                <section class="card reels-card">
                    <h3 class="section-title">Отзывы наших туристов</h3>
                    <div class="reels-row">
                        ${tourData.igReels.map((reel) => `
                            <a class="reel-card" href="${escapeHtml(reel.link)}" target="_blank" rel="noopener noreferrer">
                                <img src="${escapeHtml(reel.thumbnail)}" alt="Видео отзыв">
                                <div class="reel-play">▶</div>
                            </a>
                        `).join("")}
                    </div>
                </section>
            `;
        };

        const createNoticeSection = () => {
            if (!tourData.termsNote) return "";
            return `
                <section class="card notice-card">
                    <div class="notice-row">
                        <div class="soft-icon">📄</div>
                        <div>
                            <h3 class="notice-title">Изменения и отмена</h3>
                            <p class="notice-text">${escapeHtml(tourData.termsNote)}</p>
                        </div>
                    </div>
                </section>
            `;
        };

        const renderPage = () => {
            app.innerHTML = `
                <header class="header">
                    <div class="brand-logo"><img src="${escapeHtml(tourData.logoPath)}" alt="Mango Tour"></div>
                    <div class="brand-title">MANGO TOUR</div>
                    <div class="socials">
                        <a class="social-btn social-instagram" href="${escapeHtml(tourData.contact.instagram)}" target="_blank" rel="noopener noreferrer">◎</a>
                        <a class="social-btn social-facebook" href="${escapeHtml(tourData.contact.facebook)}" target="_blank" rel="noopener noreferrer">f</a>
                    </div>
                </header>

                <main class="main">
                    <section class="card">
                        <div class="hero-bar">
                            <h1 class="hero-title">${escapeHtml(tourData.city)}</h1>
                        </div>
                        <div class="trip-grid">
                            <div class="trip-cell">${escapeHtml(tourData.dates)}</div>
                            <div class="trip-cell">${escapeHtml(tourData.pax)} чел.</div>
                        </div>
                        <div class="flight-list">
                            ${createFlightRows()}
                        </div>
                    </section>

                    ${(tourData.hotels || []).map((hotel, index) => createHotelCard(hotel, index)).join("")}
                    ${createReelsSection()}
                    ${createNoticeSection()}
                </main>
            `;
        };

        const setupExpandables = () => {
            document.querySelectorAll(".expandable-text").forEach((block) => {
                const content = block.querySelector(".expandable-text-content");
                const button = block.querySelector(".expandable-toggle");
                const lines = Number(block.dataset.lines || "5");
                content.style.webkitLineClamp = String(lines);

                requestAnimationFrame(() => {
                    const needsToggle = content.scrollHeight > content.clientHeight + 8;
                    if (!needsToggle) return;
                    button.classList.remove("hidden");
                    button.addEventListener("click", () => {
                        const expanded = !content.classList.contains("clamped");
                        if (expanded) {
                            content.classList.add("clamped");
                            content.style.webkitLineClamp = String(lines);
                            button.textContent = "Читать далее";
                        } else {
                            content.classList.remove("clamped");
                            content.style.webkitLineClamp = "unset";
                            button.textContent = "Скрыть";
                        }
                    });
                });
            });
        };

        const setupCarousels = () => {
            document.querySelectorAll("[data-carousel]").forEach((carousel) => {
                const idx = carousel.dataset.carousel;
                const track = carousel.querySelector(`[data-carousel-track="${idx}"]`);
                const count = carousel.querySelector(`[data-carousel-count="${idx}"]`);
                const dots = carousel.querySelectorAll(`[data-carousel-dot="${idx}"]`);
                if (!track || !dots.length) return;

                const update = () => {
                    const slideWidth = track.clientWidth || 1;
                    const current = Math.round(track.scrollLeft / slideWidth);
                    dots.forEach((dot, dotIndex) => dot.classList.toggle("active", dotIndex === current));
                    if (count) count.textContent = `${current + 1} / ${dots.length}`;
                };

                track.addEventListener("scroll", update, { passive: true });
                dots.forEach((dot) => {
                    dot.addEventListener("click", () => {
                        const target = Number(dot.dataset.index || "0");
                        track.scrollTo({ left: target * track.clientWidth, behavior: "smooth" });
                    });
                });
                update();
            });
        };

        const openReviews = (reviews) => {
            reviewsList.innerHTML = reviews.length ? reviews.map((review) => `
                <div class="review-card">
                    <div class="review-head">
                        <div>
                            <p class="review-author">${escapeHtml(review.author || "Гость")}</p>
                            <div class="review-date">${escapeHtml(review.date || "")}</div>
                        </div>
                        <div class="review-score">Оценка: ${escapeHtml(Number(review.rating || 10).toFixed(1).replace(".0", ""))}/10</div>
                    </div>
                    ${createExpandableText(review.text || "", 3)}
                </div>
            `).join("") : `<div class="review-card"><p class="notice-text">Отзывы появятся скоро</p></div>`;

            overlay.classList.add("open");
            document.body.style.overflow = "hidden";
            setupExpandables();
        };

        const setupReviews = () => {
            document.querySelectorAll("[data-reviews-trigger]").forEach((button) => {
                button.addEventListener("click", () => {
                    const index = Number(button.dataset.reviewsTrigger || "0");
                    const hotel = (tourData.hotels || [])[index] || {};
                    openReviews(Array.isArray(hotel.reviews) ? hotel.reviews : []);
                });
            });
        };

        const closeReviews = () => {
            overlay.classList.remove("open");
            document.body.style.overflow = "auto";
        };

        reviewsClose.addEventListener("click", closeReviews);
        overlay.addEventListener("click", (event) => {
            if (event.target === overlay) closeReviews();
        });

        renderPage();
        setupExpandables();
        setupCarousels();
        setupReviews();
    </script>
</body>
</html>
